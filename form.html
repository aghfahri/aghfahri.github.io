<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Form</title>
  <meta name="robots" content="noindex">
  <script>
    (function () {
      try {
        var p = localStorage.getItem('tema') || localStorage.getItem('tema_def') || 'auto';
        var dark = p === 'dark' || (p === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
  <link rel="stylesheet" href="style.css?v=3">
  <link rel="stylesheet" href="form.css?v=3">
</head>
<body>
  <main class="wrap">
    <div class="topbar">
      <a class="btn-back" href="./" id="home"></a>
      <button class="icon-btn theme-btn" id="themeBtn" type="button" aria-label="Ganti tema terang atau gelap"></button>
    </div>
    <header class="fhead" id="fhead" hidden>
      <h1 id="ftitle"></h1>
      <div class="rich" id="fdesc"></div>
    </header>
    <div id="stage" aria-live="polite"></div>
    <noscript><p class="state"><strong>JavaScript dimatikan.</strong>Aktifkan JavaScript untuk mengisi form.</p></noscript>
  </main>
  <script src="config.js?v=3"></script>
  <script src="common.js?v=3"></script>
  <script src="form.js?v=3"></script>
</body>
</html>
